name: Update PIF
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate gms_certified_props.json
        run: python3 scripts/update_pif.py

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gms_certified_props.json
          if git diff --cached --quiet; then
            echo "nothing to do"
            exit 0
          fi
          BUILD=$(python3 -c "import json; print(json.load(open('gms_certified_props.json'))['ID'])")
          git commit -m "Update to $BUILD"
          git push
